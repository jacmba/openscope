name: release-checks

on:
  push:
    branches:
      - 'release/*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate-version.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract version from branch name
      id: branch-version
      run: |
        BRANCH_NAME=${GITHUB_REF#refs/heads/}
        VERSION=${BRANCH_NAME#release/}
        echo "Branch: $BRANCH_NAME"
        echo "Extracted version: $VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Get package.json version
      id: package-version
      run: |
        PACKAGE_VERSION=$(node -p "require('./package.json').version")
        echo "Package version: $PACKAGE_VERSION"
        echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

    - name: Validate version match
      id: validate-version
      run: |
        BRANCH_VERSION="${{ steps.branch-version.outputs.version }}"
        PACKAGE_VERSION="${{ steps.package-version.outputs.package_version }}"
        
        echo "Branch version: $BRANCH_VERSION"
        echo "Package version: $PACKAGE_VERSION"
        
        if [ "$BRANCH_VERSION" != "$PACKAGE_VERSION" ]; then
          echo "❌ Version mismatch!"
          echo "Branch version ($BRANCH_VERSION) does not match package.json version ($PACKAGE_VERSION)"
          exit 1
        fi
        
        echo "✅ Version validation passed!"
        echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

  lint:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2 # makes available shas HEAD (head of this branch) and HEAD~1 (previous commit on this branch) - Note: this is different in a PR action!
    - name: Use Node.JS v11.3
      uses: actions/setup-node@v1
      with:
        node-version: 11.3
    - name: Install dependencies
      run: npm install
    - name: Find lint errors on changed lines
      run: npm run lint-diff HEAD~1..HEAD
  build:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Use Node.JS v11.3
      uses: actions/setup-node@v1
      with:
        node-version: 11.3
    - name: Install dependencies
      run: npm install
    - name: Build application
      run: npm run build
  test:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Use Node.JS v11.3
      uses: actions/setup-node@v1
      with:
        node-version: 11.3
    - name: Install dependencies
      run: npm install
    - name: Run test suite
      run: npm run test

  docker:
    needs: [version-check, lint, build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=${{ needs.version-check.outputs.version }}
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
